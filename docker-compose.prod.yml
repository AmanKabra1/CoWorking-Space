version: '3.9'

# Production Docker Compose
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env file: ./backend/.env.production
# (copy .env.example, fill in TiDB Cloud + Redis + Brevo credentials)

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-coworkhub}/coworkhub-backend:latest
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn coworkhub.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --worker-class gthread
               --threads 2
               --timeout 120
               --access-logfile -
               --error-logfile -"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=coworkhub.settings.production
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    image: ${DOCKERHUB_USERNAME:-coworkhub}/coworkhub-backend:latest
    command: celery -A coworkhub worker --loglevel=info --concurrency=4 -Q default,billing,notifications
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=coworkhub.settings.production
    env_file:
      - ./backend/.env.production
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  celery_beat:
    image: ${DOCKERHUB_USERNAME:-coworkhub}/coworkhub-backend:latest
    command: celery -A coworkhub beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=coworkhub.settings.production
    env_file:
      - ./backend/.env.production
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_volume:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_volume:
  static_volume:
  redis_volume:
