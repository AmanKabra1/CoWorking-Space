# Render Blueprint — https://render.com/docs/blueprint-spec
# One-click deploy: connect your GitHub repo and Render will provision all services below.

services:
  # ── Django / Gunicorn web service ────────────────────────
  - type: web
    name: coworkhub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter          # upgrade to standard/pro for production traffic
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coworkhub.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DB_NAME
        sync: false        # set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: TIDB_SSL_CA
        sync: false        # path to CA cert bundled in image or left blank for system CA
      - key: REDIS_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://coworkhub.onrender.com,https://your-frontend-domain.com
      - key: BREVO_EMAIL_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@coworkhub.com

  # ── Celery worker ─────────────────────────────────────────
  - type: worker
    name: coworkhub-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A coworkhub worker --loglevel=info --concurrency=2
    plan: starter
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coworkhub.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: coworkhub-backend
          envVarKey: SECRET_KEY
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: TIDB_SSL_CA
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString

  # ── Celery beat scheduler ─────────────────────────────────
  - type: worker
    name: coworkhub-celery-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A coworkhub beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    plan: starter
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coworkhub.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: coworkhub-backend
          envVarKey: SECRET_KEY
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: TIDB_SSL_CA
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: coworkhub-redis
          property: connectionString

# ── Redis ─────────────────────────────────────────────────
  - type: redis
    name: coworkhub-redis
    plan: free
    maxmemoryPolicy: noeviction
