name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Django checks & lint
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: coworkhub.settings.development
      SECRET_KEY: ci-insecure-key-for-testing-only
      REDIS_URL: redis://localhost:6379/0

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/development.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migration files
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --no-input

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      - name: Check for unapplied migrations
        working-directory: backend
        run: python manage.py migrate --check

      - name: Lint with flake8
        working-directory: backend
        run: |
          pip install flake8 --quiet
          flake8 apps/ coworkhub/ \
            --max-line-length=120 \
            --exclude=migrations,__pycache__ \
            --ignore=E501,W503,E302
